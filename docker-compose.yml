services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=erp
    volumes:
      - postgres-data:/var/lib/postgresql/data

  chicken-backend:
    image: nguyentienthanh2909/chicken-backend
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chicken-backend
    ports:
      - '8080:8080'
    env_file:
      - .env

volumes:
  redis-data:
  postgres-data:
